[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stablepeg"
version = "0.1.0"
description = "are the stablecoins still a dollar? uniswap v3 and curve prices read straight from ethereum mainnet, compared with coingecko. no keys."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alina Schanz" }]
keywords = ["ethereum", "stablecoins", "uniswap", "curve", "defi", "cli"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/alinaschanz/stablepeg"
Author = "https://alinaschanz.life"

[project.scripts]
stablepeg = "stablepeg.cli:main"

[tool.setuptools]
packages = ["stablepeg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py310"
